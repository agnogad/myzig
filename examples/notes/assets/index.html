<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2c3039;
    --ink: #e8eaee;
    --muted: #98a0ae;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .count { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header .saved { color: var(--muted); font-size: 12px; }
  form {
    padding: 14px 20px;
    display: grid;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  input, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; }
  button {
    padding: 8px 15px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 10px 20px 24px; overflow-y: auto; flex: 1; }
  li {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 13px;
    margin-bottom: 8px;
    background: var(--panel);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  li .text { flex: 1; min-width: 0; }
  li .title { font-weight: 600; margin-bottom: 3px; overflow-wrap: anywhere; }
  li .body { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  li button { padding: 4px 9px; font-size: 12px; }
  .empty { color: var(--muted); padding: 28px 20px; text-align: center; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fbfbfc; --panel: #fff; --line: #e2e5ea; --ink: #1b1e24; --muted: #68707d; --accent: #3b6fd4; }
    button.primary { color: #fff; }
  }
</style>
</head>
<body>
  <header>
    <h1>Notes</h1>
    <span class="count" id="count">0</span>
    <span class="spacer"></span>
    <span class="saved" id="saved"></span>
  </header>

  <form id="composer">
    <input id="title" placeholder="Title" maxlength="200" autocomplete="off">
    <textarea id="body" rows="2" placeholder="Write something…" maxlength="8000"></textarea>
    <div class="row">
      <button class="primary" type="submit">Add note</button>
      <button type="button" id="cancel" hidden>Cancel</button>
      <button type="button" id="clear">Clear the form</button>
    </div>
  </form>

  <ul id="list"></ul>
  <p class="empty" id="empty">No notes yet. Write one above, or press Ctrl+N.</p>

  <script src="app.js"></script>
</body>
</html>
